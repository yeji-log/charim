<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 32px 이상에서는 심볼 원본, 16px 탭 아이콘은 픽셀에 맞춰 새로 그린 전용 파일을
         쓴다. 원본은 가로 막대가 16px에서 0.87px로 뭉개진다(brand/logo/README.md). -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-16.svg" sizes="16x16" type="image/svg+xml" />
    <!-- 홈 화면에 추가했을 때 쓰는 아이콘. **모서리를 미리 둥글게 굽지 않았다** —
         iOS 와 안드로이드가 각자 마스크를 씌우므로, 미리 깎으면 두 번 깎여
         모서리에 투명한 자국이 남는다. 심볼은 한 변의 62%라 안드로이드
         maskable 안전 영역 안에 들어간다. -->
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#315C8C" />
    <meta name="description" content="오늘의 수업을 차리다. 시간표·수업자료·수업기록을 한곳에서 준비하는 교사용 수업 도구." />
    <title>차림 CHARIM — 오늘의 수업을 차리다</title>
  </head>
